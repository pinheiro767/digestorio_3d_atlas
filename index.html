<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7554cf"><link rel="manifest" href="manifest.webmanifest"><title>Atlas 3D Digestório</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#e7d9ff,#c7f1f2 55%,#fce3ed);font:16px system-ui,sans-serif;color:#293050;min-height:100vh}header{padding:24px 18px;text-align:center}h1{font-size:clamp(26px,5vw,42px);margin:0;text-shadow:0 3px white}header p{margin:8px 0}.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px}button,.btn,select,input{font:inherit}button,.btn{cursor:pointer;border:1px solid #ffffff9c;border-radius:22px;padding:13px 18px;font-weight:750;color:#32255e;background:linear-gradient(155deg,#fff,#b9abff);box-shadow:inset 0 3px 5px #fff,0 7px 0 #8b78bd,0 12px 18px #5b3b8155;transition:transform .12s}button:active,.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 5px #fff,0 2px 0 #8b78bd}.pink{background:linear-gradient(150deg,#fff0f6,#ff9cc4)}.mint{background:linear-gradient(150deg,#eafff9,#70e3cb)}.gold{background:linear-gradient(150deg,#fff9d5,#ffd46c)}.btn input{display:none}main{max-width:1250px;margin:auto;padding:12px 16px 40px}.search{width:100%;padding:16px;border-radius:20px;border:2px solid white;box-shadow:0 6px 18px #6663;background:#ffffffd9;margin:16px 0}nav{display:flex;gap:9px;overflow:auto;padding:10px 0 18px}nav button{white-space:nowrap;font-size:14px;padding:11px 15px}.selected{outline:3px solid #7452c9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:linear-gradient(145deg,#ffffffeb,#e6d9ffde);border:2px solid white;border-radius:28px;padding:14px;box-shadow:0 15px 28px #5950783d,inset 0 2px 6px white;min-height:290px;display:flex;flex-direction:column;gap:12px}.card h3{font-size:17px;margin:4px 0}.preview{height:175px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#c4c8f2,#f5f4ff);overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.preview span{font-size:55px}.card button{margin-top:auto}.muted{color:#655d7c;font-size:13px}dialog{width:min(100vw,950px);height:min(96vh,900px);border:0;border-radius:25px;padding:15px;background:#f5eeff;color:#28213e}dialog::backdrop{background:#120a2bdd}.viewtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.viewtop h2{font-size:18px;flex:1}.photo{height:58%;background:#241b39;border-radius:20px;overflow:auto;display:grid;place-items:center;margin:12px 0;touch-action:pan-x pan-y}.photo img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .1s}.thumbs{display:flex;gap:8px;overflow-x:auto}.thumbs img{width:90px;height:90px;object-fit:contain;background:white;border-radius:12px;cursor:pointer}.hint{font-size:12px}.print{display:none}@media print{@page{size:A4;margin:10mm}body{background:white!important}header,main,dialog{display:none!important}.print{display:block!important}.page{break-after:page;page-break-after:always;height:270mm;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.page:last-child{break-after:auto}.page h2{font-size:16pt;text-align:center}.page img{max-width:100%;max-height:235mm;object-fit:contain}.page p{font-size:10pt;overflow-wrap:anywhere;max-height:18mm}}
</style></head><body><header><h1>🧬 Atlas 3D • Digestório</h1><p>Explore cada estrutura por nome • Fotografias anatômicas reais</p><div class="bar"><label class="btn mint">📸 Adicionar fotos<input type="file" id="upload" accept="image/*" multiple></label><button class="gold" id="pdf">📄 PDF sem cortes</button><button class="pink" id="backup">💾 Backup</button><label class="btn">📥 Restaurar<input type="file" id="restore" accept="application/json"></label></div><small>Fotos novas ficam neste dispositivo; exporte o backup para preservá-las.</small></header><main><input class="search" id="search" placeholder="🔎 Buscar estrutura: genioglosso, faringe, língua..."><nav id="nav"></nav><div id="count" class="muted"></div><div class="grid" id="grid"></div></main><dialog id="modal"><div class="viewtop"><button id="close">✕</button><h2 id="title"></h2><button id="minus">−</button><button id="plus">＋</button><button id="rotate">↻</button></div><div class="photo"><img id="big"></div><div class="thumbs" id="thumbs"></div><p class="hint">Amplie e gire para estudar. Adicione fotos diretamente à estrutura selecionada.</p><label class="btn mint">＋ Fotos nesta estrutura<input id="add" type="file" accept="image/*" multiple></label><button class="pink" id="delete">Excluir foto adicionada</button></dialog><div id="print" class="print"></div><script src="catalog.js"></script><script src="main.js"></script></body></html>
